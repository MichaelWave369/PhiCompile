name: Verify PhiCompile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke on synthetic fixtures
        run: |
          python -m phicompile --vault .phicompile init
          python -m phicompile --vault .phicompile ingest samples/example-a.md
          python -m phicompile --vault .phicompile ingest samples/example-b.md
          python -m phicompile --vault .phicompile verify
          python -m phicompile --vault .phicompile compile
          python -m phicompile --vault .phicompile plan --max-pairs 8
          python -m phicompile --vault .phicompile reviews
          python -m phicompile --vault .phicompile ingest benchmarks/fixtures/memory.md --origin SIMULATED
          python -m phicompile --vault .phicompile ingest benchmarks/fixtures/review.md --origin SIMULATED
          python -m phicompile --vault .phicompile ingest benchmarks/fixtures/models.md --origin SIMULATED
          python -m phicompile --vault .phicompile ingest benchmarks/fixtures/geometry.md --origin SIMULATED
          python -m phicompile --vault .phicompile ingest benchmarks/fixtures/routing.md --origin SIMULATED
          python -m phicompile --vault .phicompile bench --cases benchmarks/fixtures/gold.json --k 3 > benchmark-smoke.json
          python -c "import json; r=json.load(open('benchmark-smoke.json')); assert r['case_count']==10 and r['phirecall']['positive_cases']==8 and r['phirecall']['negative_cases']==2 and r['phirecall']['no_match_accuracy']==1.0"
          python -m phicompile --vault .phicompile bench-catalog --limit 2 > benchmark-catalog.json
          python -c "import json; r=json.load(open('benchmark-catalog.json')); assert r['returned']==2 and r['entries'][0]['claim_status']=='INFERRED'"
          python -m phicompile --vault .phicompile recall "prototype ready" --limit 2 > recall-smoke.json
          python -c "import json; r=json.load(open('recall-smoke.json')); assert r['returned']==2 and all(x['claim_status']=='INFERRED' for x in r['results'])"
          python -m phicompile --vault .phicompile recall "nonexistentword" --limit 2 > recall-empty.json
          python -c "import json; r=json.load(open('recall-empty.json')); assert r['status']=='NO_MATCH'"
          python -m phicompile --vault .phicompile graph
          test -s .phicompile/output/graph/index.html
          test -s .phicompile/output/graph/graph.json
          grep -q EVIDENCED_BY .phicompile/output/graph/graph.json
          grep -q "Possible contradictions: 1" .phicompile/output/LATEST.md

  public-lab:
    name: Verify React public lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Test synthetic evidence fixtures
        working-directory: site
        run: npm test
      - name: Build Pages assets
        working-directory: site
        run: npm run build
      - name: Verify production artifacts
        run: |
          test -s site/dist/index.html
          test -f site/dist/phi.svg
          grep -q '/PhiCompile/assets/' site/dist/index.html
