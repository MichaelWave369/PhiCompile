[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phicompile"
version = "0.2.0"
description = "Local-first evidence-governed knowledge compiler"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MichaelWave369"}]
readme = "README.md"

[project.scripts]
phicompile = "phicompile.cli:main"

[tool.setuptools.packages.find]
include = ["phicompile*"]
